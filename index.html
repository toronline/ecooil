document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    <span style=\"font:500 15px 'Sarabun';color:rgba(237,242,240,.5);padding-bottom:5px\">กก.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:16px;background:rgba(255,255,255,.07);border-radius:8px;overflow:hidden\">\n              <div style=\"background:#0F1513;padding:12px 14px\">\n                <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">ต้นทุนเฉลี่ยทั้งหมด<\u002Fdiv>\n                <div style=\"font:600 19px 'IBM Plex Mono';color:#5FD79A;margin-top:3px\">{{ avgCostText }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#0F1513;padding:12px 14px\">\n                <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">มูลค่าคงเหลือ<\u002Fdiv>\n                <div style=\"font:600 19px 'IBM Plex Mono';color:#EDF2F0;margin-top:3px\">{{ stockValueText }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px\">\n            <button sc-camel-on-click=\"{{ goBuy }}\" style=\"border:none;cursor:pointer;border-radius:10px;padding:16px 14px;background:#2E7A55;color:#F2FFF8;text-align:left;display:flex;flex-direction:column;gap:2px\" style-hover=\"background:#369063\">\n              <span style=\"font:600 17px 'Sarabun'\">ซื้อเข้า<\u002Fspan>\n              <span style=\"font:400 11px 'Sarabun';opacity:.72\">รับน้ำมันเข้าสต๊อก<\u002Fspan>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goSell }}\" style=\"border:1px solid rgba(224,184,76,.5);cursor:pointer;border-radius:10px;padding:16px 14px;background:#1A1710;color:#F0D999;text-align:left;display:flex;flex-direction:column;gap:2px\" style-hover=\"background:#221D14\">\n              <span style=\"font:600 17px 'Sarabun'\">ตัดขาย<\u002Fspan>\n              <span style=\"font:400 11px 'Sarabun';opacity:.7\">ตัดยอดจากที่ซื้อไว้<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px\">\n            <span style=\"font:600 13px 'Sarabun';color:#EDF2F0\">สรุปราคาเฉลี่ยรายเดือน<\u002Fspan>\n            <span style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.4)\">บาท/กก. จากการซื้อ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden\">\n            <sc-for list=\"{{ monthly }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:#101514\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:500 13px 'Sarabun';color:#EDF2F0\">{{ m.label }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.42);margin-top:2px\">{{ m.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width:74px;height:26px;display:flex;align-items:flex-end;gap:2px\">\n                  <sc-for list=\"{{ m.bars }}\" as=\"b\" hint-placeholder-count=\"4\">\n                    <span style=\"flex:1;background:rgba(95,215,154,.35);border-radius:1px\" style-hover=\"background:#5FD79A\" data-h=\"{{ b.h }}\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"text-align:right;min-width:62px\">\n                  <div style=\"font:600 16px 'IBM Plex Mono';color:#EDF2F0\">{{ m.avg }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'IBM Plex Mono';color:{{ m.deltaColor }}\">{{ m.delta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:#0D1211\">\n              <span style=\"font:500 12px 'Sarabun';color:rgba(237,242,240,.6)\">เฉลี่ยทั้งหมด (ก่อนตัดขาย)<\u002Fspan>\n              <span style=\"font:600 17px 'IBM Plex Mono';color:#5FD79A\">{{ avgAllBuyText }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:20px 0 8px;font:600 13px 'Sarabun';color:#EDF2F0\">รายการล่าสุด<\u002Fdiv>\n          <sc-for list=\"{{ recent }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)\">\n              <span style=\"width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 11px 'Sarabun';background:{{ t.chipBg }};color:{{ t.chipFg }}\">{{ t.chip }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:500 13px 'Sarabun';color:#EDF2F0\">{{ t.title }}<\u002Fdiv>\n                <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.42)\">{{ t.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:600 14px 'IBM Plex Mono';color:{{ t.amtColor }}\">{{ t.amount }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isBuy }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:ecoup .28s ease both\">\n          <div style=\"font:600 20px 'Sarabun';color:#EDF2F0\">บันทึกการซื้อ<\u002Fdiv>\n          <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.45);margin-top:2px\">ระบุปริมาณเป็นกิโลกรัม ระบบรวมค่าให้อัตโนมัติ<\u002Fdiv>\n\n          <div style=\"margin-top:18px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#101514;padding:16px\">\n            <div style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5)\">ปริมาณ (กิโลกรัม)<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:4px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:8px\">\n              <input value=\"{{ buyKg }}\" sc-camel-on-change=\"{{ onBuyKg }}\" sc-camel-input-mode=\"decimal\" placeholder=\"0\" style=\"flex:1;min-width:0;background:transparent;border:none;outline:none;font:600 32px 'IBM Plex Mono';color:#EDF2F0;padding:0\">\n              <span style=\"font:500 14px 'Sarabun';color:rgba(237,242,240,.45)\">กก.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:12px\">\n              <sc-for list=\"{{ kgChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"flex:1;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:#161D1B;color:rgba(237,242,240,.75);border-radius:8px;padding:8px 0;font:500 12px 'IBM Plex Mono'\" style-hover=\"background:#1E2724;color:#EDF2F0\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#101514;padding:16px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5)\">ราคารับซื้อ (บาท/กก.)<\u002Fspan>\n              <span style=\"font:500 10px 'Sarabun';padding:3px 7px;border-radius:5px;background:{{ priceTagBg }};color:{{ priceTagFg }}\">{{ priceTag }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:4px\">\n              <input value=\"{{ buyPrice }}\" sc-camel-on-change=\"{{ onBuyPrice }}\" sc-camel-input-mode=\"decimal\" style=\"flex:1;min-width:0;background:transparent;border:none;outline:none;font:600 28px 'IBM Plex Mono';color:#EDF2F0;padding:0\">\n              <button sc-camel-on-click=\"{{ resetBuyPrice }}\" style=\"cursor:pointer;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(237,242,240,.6);border-radius:7px;padding:6px 10px;font:500 11px 'Sarabun'\" style-hover=\"color:#EDF2F0;border-color:rgba(255,255,255,.3)\">ใช้ราคาที่บันทึก<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.38);margin-top:8px\">ดึงจากเมนู “บันทึกราคา” แก้ไขเฉพาะรายการนี้ได้<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#101514;padding:14px 16px\">\n            <div style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5);margin-bottom:6px\">ผู้ขาย / หมายเหตุ<\u002Fdiv>\n            <input value=\"{{ buyNote }}\" sc-camel-on-change=\"{{ onBuyNote }}\" placeholder=\"เช่น ร้านข้าวมันไก่เจ๊หน่อย\" style=\"width:100%;box-sizing:border-box;background:transparent;border:none;outline:none;font:500 14px 'Sarabun';color:#EDF2F0;padding:0\">\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px;border:1px solid rgba(95,215,154,.28);border-radius:10px;background:linear-gradient(160deg,#152A20,#101614);padding:16px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"font:500 12px 'Sarabun';color:rgba(237,242,240,.6)\">รวมเป็นเงิน<\u002Fspan>\n              <span style=\"font:600 30px 'IBM Plex Mono';color:#5FD79A\">{{ buyTotalText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.4);text-align:right;margin-top:2px\">{{ buyFormula }}<\u002Fdiv>\n            <div style=\"height:1px;background:rgba(255,255,255,.08);margin:12px 0\"><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font:400 11px 'Sarabun';color:rgba(237,242,240,.55)\">\n              <span>ต้นทุนเฉลี่ยใหม่หลังบันทึก<\u002Fspan>\n              <span style=\"font:600 12px 'IBM Plex Mono';color:#EDF2F0\">{{ newAvgText }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ submitBuy }}\" disabled=\"{{ buyDisabled }}\" style=\"width:100%;margin-top:14px;cursor:pointer;border:none;border-radius:10px;padding:16px;background:#2E7A55;color:#F2FFF8;font:600 16px 'Sarabun';opacity:{{ buyOpacity }}\" style-hover=\"background:#369063\">บันทึกการซื้อ<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSell }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:ecoup .28s ease both\">\n          <div style=\"font:600 20px 'Sarabun';color:#EDF2F0\">ตัดขาย<\u002Fdiv>\n          <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.45);margin-top:2px\">ตัดยอดจากล็อตที่ซื้อไว้ · {{ methodLabel }}<\u002Fdiv>\n\n          <div style=\"margin-top:18px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#101514;padding:16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\">\n              <span style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5)\">จำนวนที่ตัดขาย (กิโลกรัม)<\u002Fspan>\n              <span style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.42)\">มี {{ stockKgText }} กก.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:4px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:8px\">\n              <input value=\"{{ sellKg }}\" sc-camel-on-change=\"{{ onSellKg }}\" sc-camel-input-mode=\"decimal\" placeholder=\"0\" style=\"flex:1;min-width:0;background:transparent;border:none;outline:none;font:600 32px 'IBM Plex Mono';color:#F0D999;padding:0\">\n              <button sc-camel-on-click=\"{{ sellAll }}\" style=\"cursor:pointer;border:1px solid rgba(224,184,76,.4);background:transparent;color:#F0D999;border-radius:7px;padding:6px 10px;font:500 11px 'Sarabun'\" style-hover=\"background:#221D14\">ทั้งหมด<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;display:flex;justify-content:space-between;align-items:baseline\">\n              <span style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5)\">ราคาขาย (บาท/กก.)<\u002Fspan>\n              <input value=\"{{ sellPrice }}\" sc-camel-on-change=\"{{ onSellPrice }}\" sc-camel-input-mode=\"decimal\" style=\"width:110px;text-align:right;background:transparent;border:none;outline:none;font:600 22px 'IBM Plex Mono';color:#EDF2F0;padding:0\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden\">\n            <div style=\"padding:11px 14px;background:#0D1211;font:500 11px 'Sarabun';color:rgba(237,242,240,.55)\">ตัดจากล็อตการซื้อ<\u002Fdiv>\n            <sc-for list=\"{{ allocation }}\" as=\"a\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.06);background:#101514\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:500 12px 'Sarabun';color:#EDF2F0\">{{ a.title }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.42)\">{{ a.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 13px 'IBM Plex Mono';color:#F0D999\">{{ a.kg }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noAllocation }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:16px 14px;border-top:1px solid rgba(255,255,255,.06);background:#101514;font:400 12px 'Sarabun';color:rgba(237,242,240,.38)\">ใส่จำนวนกิโลกรัมเพื่อดูล็อตที่จะถูกตัด<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px;border:1px solid rgba(224,184,76,.28);border-radius:10px;background:linear-gradient(160deg,#241F14,#101614);padding:16px\">\n            <div style=\"display:flex;justify-content:space-between;font:400 12px 'Sarabun';color:rgba(237,242,240,.6)\">\n              <span>ยอดขายรวม<\u002Fspan><span style=\"font:600 14px 'IBM Plex Mono';color:#EDF2F0\">{{ sellRevenueText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font:400 12px 'Sarabun';color:rgba(237,242,240,.6);margin-top:7px\">\n              <span>ต้นทุนที่ตัดออก<\u002Fspan><span style=\"font:600 14px 'IBM Plex Mono';color:#EDF2F0\">{{ sellCostText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:1px;background:rgba(255,255,255,.08);margin:12px 0\"><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n              <span style=\"font:500 13px 'Sarabun';color:#EDF2F0\">กำไรขั้นต้น<\u002Fspan>\n              <span style=\"font:600 26px 'IBM Plex Mono';color:{{ profitColor }}\">{{ sellProfitText }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ submitSell }}\" disabled=\"{{ sellDisabled }}\" style=\"width:100%;margin-top:14px;cursor:pointer;border:none;border-radius:10px;padding:16px;background:#C9A227;color:#1A1508;font:600 16px 'Sarabun';opacity:{{ sellOpacity }}\" style-hover=\"background:#DDB331\">ยืนยันการตัดขาย<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPrice }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:ecoup .28s ease both\">\n          <div style=\"font:600 20px 'Sarabun';color:#EDF2F0\">บันทึกราคา<\u002Fdiv>\n          <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.45);margin-top:2px\">ราคานี้จะถูกใช้เป็นค่าตั้งต้นในการซื้อ<\u002Fdiv>\n\n          <div style=\"margin-top:18px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:linear-gradient(165deg,#16211D,#101614);padding:18px\">\n            <div style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5)\">ราคาร          <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ buyGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"margin-top:16px;border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px;background:#0D1211\">\n                <div>\n                  <div style=\"font:600 12px 'Sarabun';color:#EDF2F0\">{{ g.title }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.4);margin-top:2px\">{{ g.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right\">\n                  <div style=\"font:600 14px 'IBM Plex Mono';color:#5FD79A\">{{ g.avg }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.4)\">เฉลี่ย/กก.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid rgba(255,255,255,.06);background:#101514\">\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font:500 12px 'Sarabun';color:#EDF2F0\">{{ r.note }}<\u002Fdiv>\n                    <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.42);margin-top:2px\">{{ r.date }} · {{ r.price }} บาท/กก.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right\">\n                    <div style=\"font:600 13px 'IBM Plex Mono';color:#EDF2F0\">{{ r.kg }} กก.<\u002Fdiv>\n                    <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.4)\">{{ r.amount }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-top:1px solid rgba(255,255,255,.08);background:#0D1211;font:500 11px 'Sarabun';color:rgba(237,242,240,.6)\">\n                <span>รวม {{ g.kg }} กก.<\u002Fspan><span style=\"font:600 12px 'IBM Plex Mono';color:#EDF2F0\">{{ g.amount }} บาท<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSellReport }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:ecoup .28s ease both\">\n          <div style=\"font:600 20px 'Sarabun';color:#EDF2F0\">รายงานการขาย<\u002Fdiv>\n          <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.45);margin-top:2px\">ดูตามรอบการตัดขาย หรือดูรวมทั้งหมด<\u002Fdiv>\n\n          <div style=\"display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px\">\n            <sc-for list=\"{{ sellRoundChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"flex:none;cursor:pointer;border-radius:8px;padding:7px 12px;font:500 12px 'Sarabun';border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px;border:1px solid rgba(224,184,76,.28);border-radius:10px;background:linear-gradient(160deg,#241F14,#101614);padding:16px\">\n            <div style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.55)\">{{ sellTotalLabel }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px\">\n              <div>\n                <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">ปริมาณขายรวม (กก.)<\u002Fdiv>\n                <div style=\"font:600 20px 'IBM Plex Mono';color:#EDF2F0;margin-top:2px\">{{ srKg }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">ยอดขายรวม<\u002Fdiv>\n                <div style=\"font:600 20px 'IBM Plex Mono';color:#EDF2F0;margin-top:2px\">{{ srRevenue }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">ราคาขายเฉลี่ย/กก.<\u002Fdiv>\n                <div style=\"font:600 20px 'IBM Plex Mono';color:#F0D999;margin-top:2px\">{{ srAvg }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">กำไรขั้นต้น<\u002Fdiv>\n                <div style=\"font:600 20px 'IBM Plex Mono';color:#5FD79A;margin-top:2px\">{{ srProfit }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ sellRounds }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div style=\"margin-top:16px;border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px;background:#0D1211\">\n                <div>\n                  <div style=\"font:600 12px 'Sarabun';color:#EDF2F0\">{{ r.title }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.4);margin-top:2px\">{{ r.date }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 14px 'IBM Plex Mono';color:{{ r.profitColor }}\">{{ r.profit }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:rgba(255,255,255,.07)\">\n                <div style=\"background:#101514;padding:11px 12px\">\n                  <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">ปริมาณ<\u002Fdiv>\n                  <div style=\"font:600 14px 'IBM Plex Mono';color:#EDF2F0;margin-top:2px\">{{ r.kg }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#101514;padding:11px 12px\">\n                  <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">ราคา/กก.<\u002Fdiv>\n                  <div style=\"font:600 14px 'IBM Plex Mono';color:#F0D999;margin-top:2px\">{{ r.price }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#101514;padding:11px 12px\">\n                  <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.45)\">ยอดขาย<\u002Fdiv>\n                  <div style=\"font:600 14px 'IBM Plex Mono';color:#EDF2F0;margin-top:2px\">{{ r.revenue }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-top:1px solid rgba(255,255,255,.08);background:#0D1211;font:400 11px 'Sarabun';color:rgba(237,242,240,.55)\">\n                <span>ต้นทุนที่ตัดออก {{ r.cost }} บาท<\u002Fspan><span>{{ r.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAgent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:ecoup .28s ease both\">\n          <div style=\"font:600 20px 'Sarabun';color:#EDF2F0\">ราคาตัวแทน<\u002Fdiv>\n          <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.45);margin-top:2px\">บันทึกราคาที่ตัวแทนแต่ละรายเสนอ พร้อมวันที่<\u002Fdiv>\n\n          <div style=\"margin-top:18px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#101514;padding:16px\">\n            <div style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5);margin-bottom:6px\">ชื่อตัวแทน<\u002Fdiv>\n            <input value=\"{{ agName }}\" sc-camel-on-change=\"{{ onAgName }}\" placeholder=\"เช่น ตัวแทนภาคเหนือ – คุณวิชัย\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:500 14px 'Sarabun';color:#EDF2F0;padding:11px 12px\">\n            <div style=\"display:grid;grid-template-columns:1fr 116px;gap:10px;margin-top:12px\">\n              <div>\n                <div style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5);margin-bottom:6px\">วันที่<\u002Fdiv>\n                <input value=\"{{ agDate }}\" sc-camel-on-change=\"{{ onAgDate }}\" type=\"date\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:600 14px 'IBM Plex Mono';color:#EDF2F0;padding:11px 12px;color-scheme:dark\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:500 11px 'Sarabun';color:rgba(237,242,240,.5);margin-bottom:6px\">ราคา/กก.<\u002Fdiv>\n                <input value=\"{{ agPrice }}\" sc-camel-on-change=\"{{ onAgPrice }}\" sc-camel-input-mode=\"decimal\" style=\"width:100%;box-sizing:border-box;text-align:right;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:600 16px 'IBM Plex Mono';color:#5FD79A;padding:10px 12px\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;margin-top:14px\">\n              <button sc-camel-on-click=\"{{ saveAgent }}\" disabled=\"{{ agDisabled }}\" style=\"flex:1;cursor:pointer;border:none;border-radius:10px;padding:14px;background:#2E7A55;color:#F2FFF8;font:600 15px 'Sarabun';opacity:{{ agOpacity }}\" style-hover=\"background:#369063\">บันทึกราคาตัวแทน<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between\">\n            <span style=\"font:600 13px 'Sarabun';color:#EDF2F0\">ราคาตัวแทนล่าสุด<\u002Fspan>\n            <span style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.4)\">แตะเพื่อใช้เป็นราคาซื้อ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden\">\n            <sc-for list=\"{{ agentList }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ a.onUse }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:#101514\" style-hover=\"background:#151C1A\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:500 13px 'Sarabun';color:#EDF2F0\">{{ a.name }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.42);margin-top:2px\">{{ a.date }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:500 10px 'Sarabun';padding:3px 7px;border-radius:5px;background:{{ a.tagBg }};color:{{ a.tagFg }}\">{{ a.tag }}<\u002Fspan>\n                <span style=\"font:600 16px 'IBM Plex Mono';color:#EDF2F0;min-width:56px;text-align:right\">{{ a.price }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding:13px 14px;border:1px dashed rgba(255,255,255,.14);border-radius:10px;display:flex;justify-content:space-between;font:400 11px 'Sarabun';color:rgba(237,242,240,.5)\">\n            <span>ค่าเฉลี่ยราคาตัวแทน<\u002Fspan>\n            <span style=\"font:600 13px 'IBM Plex Mono';color:#5FD79A\">{{ agentAvgText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isDb }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:ecoup .28s ease both\">\n          <div style=\"font:600 20px 'Sarabun';color:#EDF2F0\">ฐานข้อมูล<\u002Fdiv>\n          <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.5);margin-top:2px\">เก็บข้อมูลไว้ที่ Supabase ใช้ข้อมูลชุดเดียวกันได้ทุกเครื่อง<\u002Fdiv>\n\n          <div style=\"margin-top:16px;padding:14px;border:1px solid {{ sbBorder }};border-radius:10px;background:#101514\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:none;width:10px;height:10px;border-radius:50%;background:{{ sbDot }}\"><\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:600 14px 'Sarabun';color:#EDF2F0\">{{ sbSummary }}<\u002Fdiv>\n                <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.55);margin-top:2px\">{{ sbSub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ sbShowSetup }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-if value=\"{{ sbShowKeys }}\" hint-placeholder-val=\"{{ false }}\">\n              <label style=\"display:block;margin-top:14px\">\n                <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">Project URL<\u002Fspan>\n                <input value=\"{{ sbUrlDraft }}\" sc-camel-on-change=\"{{ onSbUrl }}\" placeholder=\"https://xxxx.supabase.co\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:500 13px 'IBM Plex Mono';color:#EDF2F0;padding:11px 12px\">\n              <\u002Flabel>\n              <label style=\"display:block;margin-top:10px\">\n                <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">API key (anon หรือ publishable)<\u002Fspan>\n                <input value=\"{{ sbKeyDraft }}\" sc-camel-on-change=\"{{ onSbKey }}\" placeholder=\"sb_publishable_… หรือ eyJ…\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:500 13px 'IBM Plex Mono';color:#EDF2F0;padding:11px 12px\">\n              <\u002Flabel>\n              <\u002Fsc-if>\n              <label style=\"display:block;margin-top:14px\">\n                <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">รหัสเชื่อมต่อ (ที่ตั้งไว้ในไฟล์ SQL)<\u002Fspan>\n                <input value=\"{{ sbCodeDraft }}\" sc-camel-on-change=\"{{ onSbCode }}\" type=\"password\" placeholder=\"อย่างน้อย 8 ตัว ภาษาอังกฤษ/ตัวเลข\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:500 13px 'IBM Plex Mono';color:#EDF2F0;padding:11px 12px\">\n              <\u002Flabel>\n              <div style=\"margin-top:10px;font:400 11px/1.5 'Sarabun';color:#F0D999\">เมื่อเชื่อมต่อ ข้อมูลในเครื่องนี้จะถูกแทนที่ด้วยข้อมูลในฐานข้อมูล<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ connectDb }}\" disabled=\"{{ sbConnDisabled }}\" style=\"width:100%;margin-top:12px;cursor:pointer;border:none;border-radius:10px;padding:14px;background:#2E7A55;color:#F2FFF8;font:600 15px 'Sarabun';opacity:{{ sbConnOpacity }}\" style-hover=\"background:#369063\">{{ sbConnLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ sbShowKeysLink }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ toggleSbKeys }}\" style=\"width:100%;margin-top:6px;cursor:pointer;border:none;background:transparent;padding:8px;font:500 11px 'Sarabun';color:rgba(237,242,240,.55)\" style-hover=\"color:#EDF2F0\">ตั้งค่าขั้นสูง (Project URL / API key)<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ sbShowOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;margin-top:14px\">\n                <button sc-camel-on-click=\"{{ sbSyncNow }}\" style=\"cursor:pointer;border:1px solid rgba(95,215,154,.4);border-radius:9px;padding:11px 0;background:#14201C;color:#5FD79A;font:600 12px 'Sarabun'\" style-hover=\"background:#182A22\">ซิงก์ตอนนี้<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ disconnectDb }}\" style=\"cursor:pointer;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:11px 0;background:transparent;color:rgba(237,242,240,.65);font:500 12px 'Sarabun'\" style-hover=\"color:#EDF2F0\">ตัดการเชื่อมต่อ<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ sbHasErr }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:10px;font:500 11px/1.5 'Sarabun';color:#E89A80\">{{ sbErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"margin:20px 0 8px;font:600 13px 'Sarabun';color:#EDF2F0\">ข้อมูลที่เก็บ<\u002Fdiv>\n          <div style=\"border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden\">\n            <sc-for list=\"{{ sbCounts }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:#101514\">\n                <div>\n                  <div style=\"font:500 13px 'Sarabun';color:#EDF2F0\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'IBM Plex Mono';color:rgba(237,242,240,.45);margin-top:1px\">{{ c.table }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 14px 'IBM Plex Mono';color:#EDF2F0\">{{ c.n }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px;padding:14px;border:1px dashed rgba(255,255,255,.14);border-radius:10px\">\n            <div style=\"font:600 12px 'Sarabun';color:rgba(237,242,240,.8)\">ตั้งค่าครั้งแรก<\u002Fdiv>\n            <ol style=\"margin:6px 0 0;padding-left:18px;font:400 11px/1.6 'Sarabun';color:rgba(237,242,240,.6)\">\n              <li>สมัคร supabase.com แล้วสร้างโปรเจกต์ใหม่ (Region: Singapore)<\u002Fli>\n              <li>SQL Editor → วางไฟล์ eco-oil-supabase.sql เปลี่ยนรหัสเชื่อมต่อบรรทัดล่างสุด แล้วกด Run<\u002Fli>\n              <li>Project Settings → API คัดลอก Project URL และ anon/publishable key<\u002Fli>\n              <li>กรอกทั้ง 3 ช่องด้านบน แล้วกดเชื่อมต่อ — ทำครั้งเดียวต่อเครื่อง<\u002Fli>\n            <\u002Fol>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAppt }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:ecoup .28s ease both\">\n          <div style=\"font:600 20px 'Sarabun';color:#EDF2F0\">ทำนัดหมาย<\u002Fdiv>\n          <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.5);margin-top:2px\">แตะวันที่ในปฏิทินเพื่อดูหรือลงนัด แล้วส่งเข้า Google Calendar ได้ทันที<\u002Fdiv>\n\n          <div style=\"margin-top:16px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#101514;padding:14px 12px 12px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px\">\n              <button sc-camel-on-click=\"{{ calPrev }}\" aria-label=\"เดือนก่อนหน้า\" style=\"cursor:pointer;width:34px;height:34px;flex:none;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:transparent;color:#EDF2F0;font:500 16px 'Sarabun';line-height:1\" style-hover=\"background:#182120\">‹<\u002Fbutton>\n              <div style=\"text-align:center;flex:1;min-width:0\">\n                <div style=\"font:600 15px 'Sarabun';color:#EDF2F0\">{{ calTitle }}<\u002Fdiv>\n                <div style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.5);margin-top:1px\">{{ calMonthSummary }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ calToday }}\" style=\"cursor:pointer;flex:none;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:transparent;color:rgba(237,242,240,.75);padding:8px 10px;font:500 11px 'Sarabun'\" style-hover=\"background:#182120;color:#EDF2F0\">วันนี้<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ calNext }}\" aria-label=\"เดือนถัดไป\" style=\"cursor:pointer;width:34px;height:34px;flex:none;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:transparent;color:#EDF2F0;font:500 16px 'Sarabun';line-height:1\" style-hover=\"background:#182120\">›<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:2px;margin-top:14px\">\n              <sc-for list=\"{{ calWeekdays }}\" as=\"w\" hint-placeholder-count=\"7\">\n                <div style=\"text-align:center;font:500 10px 'Sarabun';color:{{ w.fg }};padding:4px 0\">{{ w.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:2px;margin-top:2px\">\n              <sc-for list=\"{{ calDays }}\" as=\"d\" hint-placeholder-count=\"35\">\n                <button sc-camel-on-click=\"{{ d.onClick }}\" aria-label=\"{{ d.aria }}\" style=\"cursor:pointer;height:46px;border-radius:8px;border:1px solid {{ d.border }};background:{{ d.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0\" style-hover=\"border-color:rgba(95,215,154,.4)\">\n                  <span style=\"font:600 13px 'IBM Plex Mono';color:{{ d.fg }}\">{{ d.num }}<\u002Fspan>\n                  <span style=\"display:flex;gap:2px;height:5px\">\n                    <sc-for list=\"{{ d.dots }}\" as=\"x\" hint-placeholder-count=\"1\">\n                      <span style=\"width:5px;height:5px;border-radius:50%;background:{{ x.c }}\"><\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 8px\">\n            <span style=\"font:600 13px 'Sarabun';color:#EDF2F0\">{{ selTitle }}<\u002Fspan>\n            <span style=\"font:400 10px 'Sarabun';color:rgba(237,242,240,.5)\">{{ selCount }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ selEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px 14px;border:1px dashed rgba(255,255,255,.14);border-radius:10px;font:400 12px 'Sarabun';color:rgba(237,242,240,.55);text-align:center\">ยังไม่มีนัดในวันนี้ — กรอกด้านล่างเพื่อลงนัดใหม่<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ selList }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <div style=\"margin-bottom:8px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#101514;overflow:hidden\">\n              <div style=\"display:flex;gap:12px;padding:13px 14px\">\n                <div style=\"flex:none;min-width:58px;padding:6px 8px;border-radius:7px;background:rgba(46,122,85,.22);color:#5FD79A;font:600 11px 'IBM Plex Mono';text-align:center;align-self:flex-start\">{{ a.time }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:600 14px 'Sarabun';color:#EDF2F0\">{{ a.title }}<\u002Fdiv>\n                  <div style=\"font:400 11px 'Sarabun';color:rgba(237,242,240,.55);margin-top:2px\">{{ a.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ a.onDel }}\" aria-label=\"ลบนัด {{ a.title }}\" style=\"cursor:pointer;flex:none;width:30px;height:30px;border:1px solid rgba(224,120,90,.35);border-radius:7px;background:transparent;color:#E89A80;font:400 15px 'Sarabun';line-height:1\" style-hover=\"background:#221614\">×<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ a.showManual }}\" hint-placeholder-val=\"{{ true }}\">\n              <a href=\"{{ a.gcal }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ a.onSync }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-top:1px solid rgba(255,255,255,.07);background:#0D1211;font:600 12px 'Sarabun';color:{{ a.syncFg }}\">\n                <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:4px;background:#EDF2F0;display:flex;align-items:center;justify-content:center;font:700 9px 'IBM Plex Mono';color:#1A4634\">31<\u002Fspan>\n                <span>{{ a.syncLabel }}<\u002Fspan>\n              <\u002Fa>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.autoOk }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"{{ a.gLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-top:1px solid rgba(255,255,255,.07);background:#0D1211;font:600 12px 'Sarabun';color:#5FD79A\">\n                  <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:4px;background:#EDF2F0;display:flex;align-items:center;justify-content:center;font:700 9px 'IBM Plex Mono';color:#1A4634\">31<\u002Fspan>\n                  <span>อยู่ใน Google Calendar แล้ว · เปิดดู<\u002Fspan>\n                <\u002Fa>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.autoBusy }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:11px 14px;border-top:1px solid rgba(255,255,255,.07);background:#0D1211;font:500 12px 'Sarabun';color:rgba(237,242,240,.6);text-align:center\">กำลังซิงก์กับ Google Calendar…<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.autoErr }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ a.onRetry }}\" style=\"width:100%;cursor:pointer;border:none;border-top:1px solid rgba(255,255,255,.07);padding:11px 14px;background:#0D1211;font:600 12px 'Sarabun';color:#F0D999\" style-hover=\"background:#151C1A\">{{ a.autoErrText }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"margin-top:14px;border:1px solid rgba(95,215,154,.28);border-radius:10px;background:linear-gradient(160deg,#152A20,#101614);padding:16px\">\n            <div style=\"font:600 13px 'Sarabun';color:#EDF2F0\">ลงนัดใหม่<\u002Fdiv>\n            <div style=\"font:400 11px 'IBM Plex Mono';color:#5FD79A;margin-top:2px\">{{ selDateThai }}<\u002Fdiv>\n            <label style=\"display:block;margin-top:12px\">\n              <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">เรื่องนัด<\u002Fspan>\n              <input value=\"{{ apTitle }}\" sc-camel-on-change=\"{{ onApTitle }}\" placeholder=\"เช่น รับน้ำมันที่โรงอาหารนิคม\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:500 14px 'Sarabun';color:#EDF2F0;padding:11px 12px\">\n            <\u002Flabel>\n            <div style=\"display:flex;gap:6px;margin-top:10px;overflow-x:auto\">\n              <sc-for list=\"{{ apQuick }}\" as=\"q\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ q.onClick }}\" style=\"flex:none;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:#161D1B;color:rgba(237,242,240,.75);border-radius:8px;padding:7px 10px;font:500 11px 'Sarabun'\" style-hover=\"background:#1E2724;color:#EDF2F0\">{{ q.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;margin-top:12px\">\n              <button sc-camel-on-click=\"{{ setTimed }}\" style=\"flex:1;cursor:pointer;border-radius:8px;padding:8px 0;font:500 12px 'Sarabun';border:1px solid {{ timedBorder }};background:{{ timedBg }};color:{{ timedFg }}\">ระบุเวลา<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setAllDay }}\" style=\"flex:1;cursor:pointer;border-radius:8px;padding:8px 0;font:500 12px 'Sarabun';border:1px solid {{ allDayBorder }};background:{{ allDayBg }};color:{{ allDayFg }}\">ทั้งวัน<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ apTimed }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-top:10px\">\n                <label style=\"display:block\">\n                  <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">เริ่ม<\u002Fspan>\n                  <input value=\"{{ apTime }}\" sc-camel-on-change=\"{{ onApTime }}\" type=\"time\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:600 15px 'IBM Plex Mono';color:#EDF2F0;padding:10px 12px;color-scheme:dark\">\n                <\u002Flabel>\n                <label style=\"display:block\">\n                  <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">สิ้นสุด<\u002Fspan>\n                  <input value=\"{{ apEnd }}\" sc-camel-on-change=\"{{ onApEnd }}\" type=\"time\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:600 15px 'IBM Plex Mono';color:#EDF2F0;padding:10px 12px;color-scheme:dark\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <label style=\"display:block;margin-top:10px\">\n              <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">สถานที่ / ลูกค้า<\u002Fspan>\n              <input value=\"{{ apPlace }}\" sc-camel-on-change=\"{{ onApPlace }}\" placeholder=\"เช่น ร้านหมูทอดพี่แดง\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:500 14px 'Sarabun';color:#EDF2F0;padding:11px 12px\">\n            <\u002Flabel>\n            <label style=\"display:block;margin-top:10px\">\n              <span style=\"display:block;font:500 11px 'Sarabun';color:rgba(237,242,240,.55);margin-bottom:6px\">หมายเหตุ<\u002Fspan>\n              <input value=\"{{ apNote }}\" sc-camel-on-change=\"{{ onApNote }}\" placeholder=\"เช่น ประมาณ 300 กก. เตรียมถัง 10 ใบ\" style=\"width:100%;box-sizing:border-box;background:#0D1211;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;font:500 14px 'Sarabun';color:#EDF2F0;padding:11px 12px\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ saveAppt }}\" disabled=\"{{ apDisabled }}\" style=\"width:100%;margin-top:14px;cursor:pointer;border:none;border-radius:10px;padding:15px;background:#2E7A55;color:#F2FFF8;font:600 15px 'Sarabun';opacity:{{ apOpacity }}\" style-hover=\"background:#369063\">บันทึกนัดหมาย<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px;padding:14px;border:1px solid {{ gCardBorder }};border-radius:10px;background:#101514\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span aria-hidden=\"true\" style=\"width:28px;height:28px;flex:none;border-radius:7px;background:#EDF2F0;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono';color:#1A4634\">31<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:600 13px 'Sarabun';color:#EDF2F0\">Google Calendar อัตโนมัติ<\u002Fdiv>\n                <div style=\"font:400 11px 'Sarabun';color:{{ gSummaryFg }};margin-top:1px\">{{ syncSummary }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:{{ gDot }}\"><\u002Fspan>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ gShowSetup }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:12px;font:600 11px 'Sarabun';color:rgba(237,242,240,.75)\">ตั้งค่าครั้งเดียว (ผู้ดูแลแอปทำ)<\u002Fdiv>\n              <ol style=\"margin:6px 0 0;padding-left:18px;font:400 11px/1.6 'Sarabun';color:rgba(237,242,240,.6)\">\n                <li>เข้า console.cloud.google.com สร้างโปรเจกต์ แล้วเปิดใช้ Google Calendar API<\u002Fli>\n                <li>ตั้งค่า OAuth consent screen แบบ External และเพิ่มอีเมลผู้ใช้ใน Test users<\u002Fli>\n const id=Date.now();\n        this.setState(st=>({\n          lots:[...st.lots,{id, date:this.thai(this.today()), iso:this.today(), kg:bKg, price:bPr, left:bKg, note:st.buyNote||'ไม่ระบุผู้ขาย'}],\n          tx:[{id, type:'buy', date:this.thai(this.today()), iso:this.today(), kg:bKg, price:bPr, amount:Math.floor(bKg*bPr), note:st.buyNote||'ไม่ระบุผู้ขาย'},...st.tx],\n          buyKg:'', buyNote:'', tab:'home'\n        }));\n        this.toast('บันทึกซื้อ '+this.fmt(bKg,2)+' กก. รวม '+this.fmt(bTot,0)+' บาท');\n      },\n\n      sellKg:s.sellKg, sellPrice:s.sellPrice, methodLabel: (this.props.costMethod ?? 'FIFO')==='FIFO' ? 'ตัดล็อตเก่าก่อน (FIFO)' : 'ต้นทุนถัวเฉลี่ย',\n      onSellKg:e=>this.setState({sellKg:e.target.value}),\n      onSellPrice:e=>this.setState({sellPrice:e.target.value}),\n      sellAll:()=>this.setState({sellKg:String(stock)}),\n      allocation: allocRaw.map(a=>({title:a.date, sub:a.note+' · ต้นทุน '+this.fmt(a.price)+' บาท/กก.', kg:this.fmt(a.kg,2)+' กก.'})),\n      noAllocation: allocRaw.length===0,\n      sellRevenueText:this.fmt(sRev,0)+' บาท', sellCostText:this.fmt(sCost,0)+' บาท',\n      sellProfitText:(profit>=0?'+':'−')+this.fmt(Math.abs(profit),0),\n      profitColor: profit>=0? '#5FD79A':'#E0785A',\n      sellDisabled: !(sKg>0&&sPr>0), sellOpacity: (sKg>0&&sPr>0)? 1 : .45,\n      submitSell:()=>{\n        if(!(sKg>0&&sPr>0)) return;\n        const method=this.props.costMethod ?? 'FIFO';\n        let lots=this.state.lots.map(l=>({...l}));\n        if(method==='FIFO'){\n          allocRaw.forEach(a=>{ const l=lots.find(x=>x.id===a.lotId); if(l) l.left-=a.kg; });\n        } else {\n          let left=sKg;\n          for(const l of lots){ if(left<=0) break; const take=Math.min(l.left,left); l.left-=take; left-=take; }\n        }\n        const id=Date.now();\n        this.setState(st=>({\n          lots,\n          tx:[{id, type:'sell', date:this.thai(this.today()), iso:this.today(), kg:sKg, price:sPr, amount:sRev, cost:sCost, note:'ตัดขาย
